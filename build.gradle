plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    maven {
        url "https://cursemaven.com"
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.xun.lib:xunlib-neoforge-1.21.1:${xunlib_version}"

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    runtimeOnly("maven.modrinth:rightclickharvest:4.5.3+1.21.1-neoforge")
    runtimeOnly("maven.modrinth:architectury-api:13.0.8+neoforge")
    runtimeOnly("maven.modrinth:jamlib:1.3.5+1.21.1-neoforge")

    runtimeOnly("maven.modrinth:worldedit:7.3.8")

    runtimeOnly("maven.modrinth:jade:15.10.5+neoforge")

    runtimeOnly("curse.maven:placebo-283644:6926281")
    runtimeOnly("curse.maven:apotheosis-313970:7703848")
    runtimeOnly("curse.maven:apothic-attributes-898963:7445079")
    runtimeOnly("curse.maven:apothic-enchanting-1063926:7659120")
    runtimeOnly("curse.maven:apothic-spawners-986583:7492121")
    runtimeOnly("curse.maven:patchouli-306770:7730942")

    runtimeOnly("curse.maven:gateways-to-eternity-417802:6926284")

    runtimeOnly("curse.maven:enchanting-infuser-551151:7844709")
    runtimeOnly("curse.maven:puzzles-lib-495476:7140307")

    runtimeOnly("curse.maven:stoneworks-852663:5731747")

    runtimeOnly("curse.maven:selene-499980:8089964")
    runtimeOnly("curse.maven:every-compat-628539:8017083")
    runtimeOnly("curse.maven:stone-zone-1154622:7824607")

    runtimeOnly("curse.maven:farmers-delight-398521:8672744")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
